org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
# 21.1.233 是构建时使用的版本；任意 >= 21.1.200 的 21.1.x 均可运行。
minecraft_version=1.21.1
neo_version=21.1.233

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Mod metadata
# mod_id 必须是 ^[a-z][a-z0-9_]{1,63}$（FML 4.0.x 的 VALID_MODID），因此只能用下划线；
# 品牌名里的连字符只出现在 jar 文件名与 displayName 上。
mod_id=better_minecraft_shop
mod_name=Better Minecraft Shop
mod_version=1.0.0
mod_group_id=com.lyhyy2007.bmcs
mod_authors=lyhyy2007
mod_license=MIT
mod_description=Data-driven shop mod: DeepCoin currency, FTB Library sidebar entry, JSON-configured prices and stock.

# 前置模组版本（libs/ 下没放 jar 时会按这两个版本从官方 maven 拉取）
ftb_library_version=2101.1.37
architectury_version=13.0.6
