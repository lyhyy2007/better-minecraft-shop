# 1.21.1（NeoForge 21.1.x）必须显式声明 modLoader / loaderVersion；license 必填。
# 花括号占位符由 build.gradle 的 processResources 在构建时展开（值来自 gradle.properties）。
# 注意：不要在本文件里写“美元号+花括号”形式的示例文字，它会被 Groovy 模板当表达式求值导致构建失败。
modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/lyhyy2007/better-minecraft-shop"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
# jar 根目录下的图标（构建时从工作区的 大肥鱼.png 复制而来）
logoFile="shop_icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# FTB Library：侧边栏按钮系统与界面框架（All Rights Reserved，仅通过其公开 API / JSON 集成）
[[dependencies.${mod_id}]]
modId="ftblibrary"
type="required"
versionRange="[2101.1.0,)"
ordering="AFTER"
side="BOTH"

# Architectury API：FTB Library 的强制前置；自定义侧边栏点击事件需要它的 Event API
[[dependencies.${mod_id}]]
modId="architectury"
type="required"
versionRange="[13.0.6,)"
ordering="AFTER"
side="BOTH"
